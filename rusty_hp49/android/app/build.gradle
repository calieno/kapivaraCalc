apply plugin: 'com.android.application'

android {
    namespace 'org.hp49.rusty'
    compileSdkVersion 34

    defaultConfig {
        applicationId "org.hp49.rusty"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero heavy dependencies for maximum speed and tiny APK footprint
}
