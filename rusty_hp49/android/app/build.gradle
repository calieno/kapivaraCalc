plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hp49.rusty'
    compileSdk 34

    defaultConfig {
        applicationId "org.hp49.rusty"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    // Zero dependencies for instant build and small APK size
}
