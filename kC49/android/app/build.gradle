plugins {
    id 'com.android.application'
}

android {
    namespace 'org.kapivara.kc49'
    compileSdk 34

    defaultConfig {
        applicationId "org.kapivara.kc49"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    // Zero dependencies for instant build and small APK size
}
