name: Build Multi-Platform kapivaraCalc (kC49)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. LINUX BUILD
  # =========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Build Linux Binaries (Static Musl + Standard GNU)
        run: |
          cd kC49
          cargo build --release --target x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-gnu
          mkdir -p ../artifacts
          cp target/x86_64-unknown-linux-musl/release/kC49 ../artifacts/kC49_linux_static
          cp target/x86_64-unknown-linux-gnu/release/kC49 ../artifacts/kC49_linux_x86_64
          chmod +x ../artifacts/kC49_linux*

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kC49_linux
          path: artifacts/kC49_linux*

  # =========================================================================
  # 2. WINDOWS BUILD (Standalone Desktop App)
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows .exe
        run: |
          cd kC49
          cargo build --release --target x86_64-pc-windows-msvc
          mkdir -p ../artifacts
          copy target\x86_64-pc-windows-msvc\release\kC49.exe ..\artifacts\kC49.exe
          copy target\x86_64-pc-windows-msvc\release\kC49.exe ..\artifacts\kC49_windows_x64.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kC49_windows
          path: artifacts/kC49*.exe

  # =========================================================================
  # 3. MACOS BUILD (Universal Binary: Intel x86_64 + Apple Silicon M1/M2/M3)
  # =========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Universal macOS Binary
        run: |
          cd kC49
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p ../artifacts
          lipo -create \
            target/x86_64-apple-darwin/release/kC49 \
            target/aarch64-apple-darwin/release/kC49 \
            -output ../artifacts/kC49_macos_universal
          chmod +x ../artifacts/kC49_macos_universal

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kC49_macos_universal
          path: artifacts/kC49_macos_universal

  # =========================================================================
  # 4. ANDROID APK BUILD
  # =========================================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd kC49/android
          gradle assembleDebug
          mkdir -p ../../artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../../artifacts/kC49.apk \;
          cp ../../artifacts/kC49.apk ../../artifacts/kC49_android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kC49_android.apk
          path: artifacts/kC49.apk

  # =========================================================================
  # 5. IPHONE / IOS PACKAGE
  # =========================================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package iOS Project Bundle
        run: |
          mkdir -p artifacts
          tar -czf artifacts/kC49_ios_bundle.tar.gz -C kC49/ios .

      - name: Upload iOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kC49_ios_bundle.tar.gz
          path: artifacts/kC49_ios_bundle.tar.gz

  # =========================================================================
  # 6. GITHUB RELEASE AUTOMATION (Triggers on Git Tags)
  # =========================================================================
  release:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-release
          find release-files -type f -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          name: kapivaraCalc (kC49) ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 kapivaraCalc (kC49) - Release ${{ github.ref_name }}
            
            Calculadora científica, gráfica e simbólica avançada em Rust inspirada na HP 49G com arquitetura Single-File e aplicativo nativo de desktop.
            
            ### 📦 Binários e Aplicativos Disponíveis para Download:
            - **🪟 Windows:** [`kC49.exe`](kC49.exe) / [`kC49_windows_x64.exe`](kC49_windows_x64.exe) *(Aplicativo Desktop independente com janela própria)*
            - **🐧 Linux (Estático):** [`kC49_linux_static`](kC49_linux_static) *(Musl, funciona em qualquer distro)*
            - **🐧 Linux (Padrão):** [`kC49_linux_x86_64`](kC49_linux_x86_64) *(GNU)*
            - **🍏 macOS (Universal):** [`kC49_macos_universal`](kC49_macos_universal) *(Intel + Apple Silicon M1/M2/M3/M4)*
            - **🤖 Android:** [`kC49.apk`](kC49.apk) *(Instale diretamente no smartphone Android)*
            - **📱 iPhone / iOS:** [`kC49_ios_bundle.tar.gz`](kC49_ios_bundle.tar.gz) *(Projeto nativo Swift com WKWebView / PWA)*
