name: Build Multi-Platform Rusty HP 49G

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. LINUX BUILD
  # =========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Build Linux Binaries (Static Musl + Standard GNU)
        run: |
          cd rusty_hp49
          cargo build --release --target x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-gnu
          mkdir -p ../artifacts
          cp target/x86_64-unknown-linux-musl/release/rusty_hp49 ../artifacts/rusty_hp49_linux_static
          cp target/x86_64-unknown-linux-gnu/release/rusty_hp49 ../artifacts/rusty_hp49_linux_x86_64
          chmod +x ../artifacts/rusty_hp49_linux*

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusty_hp49_linux
          path: artifacts/rusty_hp49_linux*

  # =========================================================================
  # 2. WINDOWS BUILD
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows .exe
        run: |
          cd rusty_hp49
          cargo build --release --target x86_64-pc-windows-msvc
          mkdir -p ../artifacts
          copy target\x86_64-pc-windows-msvc\release\rusty_hp49.exe ..\artifacts\rusty_hp49_windows_x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusty_hp49_windows_x64.exe
          path: artifacts/rusty_hp49_windows_x64.exe

  # =========================================================================
  # 3. MACOS BUILD (Universal Binary: Intel x86_64 + Apple Silicon M1/M2/M3)
  # =========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Universal macOS Binary
        run: |
          cd rusty_hp49
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p ../artifacts
          lipo -create \
            target/x86_64-apple-darwin/release/rusty_hp49 \
            target/aarch64-apple-darwin/release/rusty_hp49 \
            -output ../artifacts/rusty_hp49_macos_universal
          chmod +x ../artifacts/rusty_hp49_macos_universal

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusty_hp49_macos_universal
          path: artifacts/rusty_hp49_macos_universal

  # =========================================================================
  # 4. ANDROID APK BUILD
  # =========================================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd rusty_hp49/android
          gradle assembleDebug
          mkdir -p ../../artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../../artifacts/rusty_hp49_android.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: rusty_hp49_android.apk
          path: artifacts/rusty_hp49_android.apk

  # =========================================================================
  # 5. IPHONE / IOS PACKAGE
  # =========================================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package iOS Project Bundle
        run: |
          mkdir -p artifacts
          tar -czf artifacts/rusty_hp49_ios_bundle.tar.gz -C rusty_hp49/ios .

      - name: Upload iOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: rusty_hp49_ios_bundle.tar.gz
          path: artifacts/rusty_hp49_ios_bundle.tar.gz

  # =========================================================================
  # 6. GITHUB RELEASE AUTOMATION (Triggers on Git Tags)
  # =========================================================================
  release:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-release
          find release-files -type f -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          name: Rusty HP-49G ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Rusty HP-49G - Release ${{ github.ref_name }}
            
            Recriação moderna e elegante da lendária calculadora científica HP 49G em Rust (Single-File Architecture).
            
            ### 📦 Binários e Aplicativos Prontos para Download:
            - **🪟 Windows:** `rusty_hp49_windows_x64.exe`
            - **🐧 Linux (Estático):** `rusty_hp49_linux_static` (Musl, compatível com qualquer distribuição)
            - **🐧 Linux (Padrão):** `rusty_hp49_linux_x86_64` (GNU)
            - **🍏 macOS (Universal):** `rusty_hp49_macos_universal` (Intel + Apple Silicon M1/M2/M3/M4)
            - **🤖 Android:** `rusty_hp49_android.apk` (Instalável diretamente no smartphone Android)
            - **📱 iPhone / iOS:** `rusty_hp49_ios_bundle.tar.gz` (Projeto nativo Swift com WKWebView / PWA)
